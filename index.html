<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading HSA Entertainment...</title>
    <script>
        (function() {
            const supportedLangs = ['ja', 'en'];
            let preferredLang = localStorage.getItem("lang");

            if (!preferredLang) {
                const browserLang = (window.navigator.languages && window.navigator.languages[0]) || window.navigator.language;
                const primaryBrowserLang = browserLang.substring(0, 2).toLowerCase();
                if (supportedLangs.includes(primaryBrowserLang)) {
                    preferredLang = primaryBrowserLang;
                } else {
                    preferredLang = 'ja'; // デフォルト言語 (日本語)
                }
            }

            let currentPath = window.location.pathname;
            let basePath = currentPath.substring(0, currentPath.lastIndexOf('/') + 1);
            // index.html から常に index_xx.html へリダイレクト
            let targetPage = `index_${preferredLang}.html`;
            
            let queryString = window.location.search;
            let hashString = window.location.hash;

            window.location.replace(basePath + targetPage + queryString + hashString);
        })();
    </script>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 50px; color: #333; }
        /* style.css の body { visibility: hidden; } を一時的に上書きしてメッセージを表示 */
        body { visibility: visible !important; }
    </style>
</head>
<body>
    <p>Loading the correct language version for you...</p>
    <p><a href="index_ja.html">日本語 (Japanese)</a> | <a href="index_en.html">English</a></p>
</body>
</html>
